# ============================================================
# Sparkle / mihomo YAML 覆写（替代 Bettbox.js）
# 用法：Sparkle → 覆写 → 新建 → 类型选 YAML，导入本文件
#
# 说明：
# 1. 这是一个 deepMerge 补丁，不是完整配置：
#    - proxy-groups / rules 整体替换
#    - proxies+ 为追加节点（deepMerge 的 + 后缀 = append）
#    - dns! / hosts! 等带 ! 的键 = 整体替换该对象
# 2. 与原 JS 版的差异（mihomo 的 YAML 表达能力所限）：
#    - 启用 exclude-type 后，HY2/hysteria2 会被所有自动组排除；
#      若想回到纯名字分流，删除所有 exclude-type 行即可
#    - 空地区组仍会创建（mihomo 会临时塞入 COMPATIBLE），JS 则会省略
#    - 名字命中的排除项仍留在 proxies 列表里，只是不进组
# 3. 已修正原脚本的两个小问题：115 -> 115.com；emos 与 chilledmelon 两行拆开
# ============================================================
rules:
  # ---------- 自定义直连 ----------
  - DOMAIN-KEYWORD,yusen,DIRECT
  - DOMAIN-SUFFIX,fromcoast.top,DIRECT
  - DOMAIN-SUFFIX,hhanclub.top,DIRECT
  - DOMAIN-SUFFIX,tieba.baidu.com,DIRECT
  - DOMAIN-SUFFIX,micu.hk,DIRECT
  - DOMAIN-SUFFIX,uestc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,m-team.cc,DIRECT
  - DOMAIN-SUFFIX,labuladong.online,默认节点
  - DOMAIN-SUFFIX,nowcoder.com,DIRECT
  - DOMAIN-SUFFIX,115.com,DIRECT
  - DOMAIN-SUFFIX,bing.com,DIRECT
  - DOMAIN-SUFFIX,ieee.org,DIRECT
  - DOMAIN-SUFFIX,codetop.cc,DIRECT
  - DOMAIN-KEYWORD,wangjunqiang,DIRECT
  - DOMAIN-KEYWORD,lyezi,DIRECT
  - DOMAIN-KEYWORD,emos,DIRECT
  - DOMAIN-KEYWORD,v.chilledmelon.com,DIRECT

  # ---------- 私有网络 / 国内直连 ----------
  - RULE-SET,private,直连
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,steam_cn,直连
  - RULE-SET,epicgames,直连
  - RULE-SET,nvidia_cn,直连
  - RULE-SET,microsoft_cn,直连

  # ---------- 服务分流 ----------
  - RULE-SET,ai,国外AI
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,youtube)),REJECT
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,谷歌服务
  - RULE-SET,google_ip,谷歌服务,no-resolve
  - RULE-SET,steam,Steam
  - RULE-SET,googlefcm,FCM服务
  - RULE-SET,github,GitHub
  - RULE-SET,microsoft,微软服务
  - RULE-SET,emby,Emby
  - RULE-SET,emby_ip,Emby,no-resolve
  - DOMAIN-KEYWORD,emby,Emby
  - RULE-SET,AWAvenue_Ads,广告拦截

  # ---------- 兜底 ----------
  - RULE-SET,gfw,默认节点
  - RULE-SET,cn,直连
  - RULE-SET,cn_ip,直连
  - MATCH,默认节点

